[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swipewear-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "flake8>=7.0",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = [
    "contracts/tests",
    "ingestion/tests",
    "vision/tests",
    "embeddings/tests",
    "preferences/tests",
    "retrieval/tests",
    "ranking/tests",
    "policy/tests",
    "explainability/tests",
    "evaluation/tests",
    "orchestration/tests",
]
