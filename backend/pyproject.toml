[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swipewear-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "requests>=2.31",
    "numpy>=1.24",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "flake8>=7.0",
    "mypy>=1.9",
    "Pillow>=9.0",
    "httpx2>=0.1",
]
ai = [
    "gliner>=0.2",
    "open-clip-torch>=2.20",
    "Pillow>=9.0",
    "transformers>=5.0",
    "torchao>=0.15",
    "accelerate>=1.0",
    "psutil>=5.9",
    "onnxruntime>=1.17",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = [
    "contracts/tests",
    "ingestion/tests",
    "vision/tests",
    "embeddings/tests",
    "preferences/tests",
    "retrieval/tests",
    "ranking/tests",
    "policy/tests",
    "explainability/tests",
    "evaluation/tests",
    "orchestration/tests",
    "api/tests",
    "alerts/tests",
    "notifications/tests",
    "billing/tests",
]
