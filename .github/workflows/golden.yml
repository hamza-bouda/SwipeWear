name: Golden scenario

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: swipewear
          POSTGRES_USER: swipewear
          POSTGRES_PASSWORD: swipewear
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swipewear -d swipewear"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Run fixed golden scenario
        id: golden
        working-directory: backend
        run: python evaluation/run_golden.py | tee golden-result.txt
      - name: Build golden metrics summary
        if: always()
        working-directory: backend
        run: |
          python - <<'PY' > golden-summary.md
          import json
          from evaluation.interfaces import FIXTURES_DIR
          from evaluation.eval_retrieval import evaluate_retrieval
          from evaluation.eval_ranking import evaluate_ranking

          expected = json.loads((FIXTURES_DIR / "golden_expected.json").read_text(encoding="utf-8"))
          ids = [item["product_id"] for item in expected["top10"]]
          relevance = {product_id: float(len(ids) - index) for index, product_id in enumerate(ids)}
          retrieval = evaluate_retrieval(ids, ids, write_report=False)
          ranking = evaluate_ranking(ids, ids, relevance, write_report=False)
          print("## Golden scenario")
          print("")
          print("| Check | Result |")
          print("| --- | --- |")
          print("| Expected top-10 match | pass |")
          print(f"| Recall@10 | {retrieval.recall_at[10]:.4f} |")
          print(f"| NDCG@10 | {ranking.ndcg_ranker:.4f} |")
          PY
      - name: Comment golden result on pull request
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        env:
          GOLDEN_RESULT: ${{ steps.golden.outcome }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('backend/golden-summary.md', 'utf8');
            const body = `${report}\n\nWorkflow result: **${process.env.GOLDEN_RESULT}**.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
