name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint + import boundaries + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Accounts, profiles and events live in Postgres now, so the auth and API
    # integration tests need a real database: without one they error rather
    # than skip (19 errors, all "connection refused"), and skipping them would
    # leave registration and login untested before a release.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: swipewear
          POSTGRES_PASSWORD: swipewear_dev
          POSTGRES_DB: swipewear
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://swipewear:swipewear_dev@localhost:5432/swipewear

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Flake8 lint
        run: flake8 .

      - name: Import boundary check
        run: python lint_imports.py

      - name: Apply migrations
        run: python scripts/run_migrations.py

      - name: Pytest
        run: pytest --tb=short -q

  golden:
    name: Golden scenario
    runs-on: ubuntu-latest
    needs: backend
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run golden scenario
        run: python evaluation/run_golden.py
